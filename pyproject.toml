[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-studio"
version = "0.1.0"
description = "DocStudio: multi-agent research orchestration with Azure OpenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "streamlit",
  "httpx",
  "openai>=1.40.0",
  "transformers",
  "sentence-transformers",
  "faiss-cpu",
  "scikit-learn",
  "numpy",
  "pandas",
  "python-dotenv",
  "mlflow",
  "ruff",
  "mypy",
  "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
