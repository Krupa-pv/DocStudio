[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orch"
version = "0.1.0"
description = "SimplifyResearch: multi-agent research orchestration with Azure OpenAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "numpy",
  "scikit-learn",
  "openai"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
